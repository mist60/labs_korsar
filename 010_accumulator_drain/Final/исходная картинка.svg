<text x="40" y="75" font-size="18">SLVES1 → CH1 → BVOL_T1; VAL1 задает сопротивление и закрывается по объему воды.</text>
<text x="235" y="126" text-anchor="middle" font-size="22" font-weight="bold">SLVES1 · V = 1 м³</text>
