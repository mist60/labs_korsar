<text x="1028" y="423" text-anchor="middle" font-size="19">Приемник</text>
<text x="1028" y="455" text-anchor="middle" font-size="18">pb = 0.5 МПа</text>
<text x="1028" y="486" text-anchor="middle" font-size="17">(абсолютное)</text>
