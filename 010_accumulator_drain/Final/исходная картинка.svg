<text x="40" y="625" font-size="18">Аналитика: pVgⁿ = const; n = 1 → 180 с, n = 1.4 → 188.3 с до отсечки.</text>
<text x="40" y="651" font-size="16" fill="#475569">Размеры и высоты на рисунке условные. VAL присоединен к соединению CH и не является отдельным объемом.</text>
